<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baia School - Homepage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      
      <!-- School Logo and Name -->
      <a href="#" class="brand">
        <img src="logo.png" alt="Baia School Logo" class="logo-img">
        <span class="brand-name">Baia School</span>
      </a>

      <!-- Navigation Links and Settings -->
      <nav class="nav-menu">
        <ul class="nav-links">
          <li><a href="#about" class="active">About</a></li>
          <li><a href="#academics">Academics</a></li>
          <li><a href="#news">News</a></li>
          <li><a href="#events">Events</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>

        <!-- Settings Button for JavaScript -->
        <button id="settings-btn" class="settings-btn" aria-label="Settings">
          ⚙️
        </button>
      </nav>

    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Empowering Tomorrow's Leaders</h1>
      <p>Providing excellence in education, character building, and community development at Baia School.</p>
      <div class="hero-actions">
        <a href="#about" class="btn primary-btn">Learn More</a>
        <a href="#contact" class="btn secondary-btn">Contact Us</a>
      </div>
    </div>
  </section>

</body>
</html>
